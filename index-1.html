<style>

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 860px; max-height: 84%; margin: 0 auto; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); animation: up 0.22s ease-out; }

.field textarea { min-height: 120px; resize: vertical; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 70; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 11px 18px; background: var(--ink); color: var(--bg); border-radius: 14px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); animation: up 0.2s ease-out; }
[hidden] { display: none !important; }
input, textarea, select { box-sizing: border-box; max-width: 100%; }
.field { min-width: 0; }
.filewrap { position: relative; display: inline-flex; }

.opt.filewrap { position: relative; }
:root { --font-display: system-ui, "Segoe UI", Roboto, sans-serif; --font-ui: system-ui, "Segoe UI", Roboto, sans-serif; }
.brand, .sheet h2, .empty h2 { font-family: var(--font-display); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
.scan { position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; padding: 12px 52px 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-align: left; }

.scan .more { position: absolute; top: 6px; right: 4px; }
.empty { padding: 36px 8px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty h2 { margin: 0; font-size: 26px; color: var(--ink); }
.empty p { margin: 0; max-width: 32ch; }
.ed { height: 100%; position: relative; }
.stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
.pg { position: relative; background: #fff; box-shadow: var(--shadow); border-radius: 4px; touch-action: none; }

.sigbar { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px; scrollbar-width: none; }

.thumb[aria-current="true"] { border-color: var(--accent); }
.thumb i { position: absolute; right: 2px; bottom: 2px; min-width: 16px; padding: 0 3px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 11px; font-style: normal; line-height: 16px; text-align: center; }
.thumb.add { display: grid; place-items: center; color: var(--accent); border-style: dashed; }
.tools { display: flex; gap: 2px; overflow-x: auto; padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool { flex: 1 0 64px; display: grid; justify-items: center; gap: 2px; min-height: 56px; padding: 6px 4px; background: transparent; border: 0; border-radius: 12px; color: var(--ink); font-size: 12px; font-weight: 600; }
.tool:hover { background: var(--accent-soft); }
.tool svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--accent); }
.crop { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); }

.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
*, *::before, *::after { box-sizing: border-box; }

<div id="app">

<script>
/* ===== Utilidades ===== */

/* hojas desde abajo */
